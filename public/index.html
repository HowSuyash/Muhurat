<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhurat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
/* A committed night scene: the ignition glow only reads on a dark ground, so
   every colour is painted explicitly rather than inherited from the host. */
:root{
  color-scheme:dark;
  --night:#0c0a08;--night2:#141110;--panel:#17140f;--panel2:#1d1913;--edge:#2a251e;--edge2:#3a332a;
  --ink:#f7f3ec;--ink2:#c8c1b4;--ink3:#8c857a;
  --flame:#f5b13d;--hot:#ffd98a;--ember:#e0663a;
  --a1:#4a94ee;--a2:#e0663a;--a3:#22b183;--a4:#d55181;--a5:#9085e9;--a6:#e66767;--a7:#c98500;
  --dim:#3a342c;--good:#22b183;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{margin:0;color:var(--ink);font:15.5px/1.65 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{width:100%;max-width:1720px;margin:0 auto;padding:0 clamp(18px,2.6vw,44px) 70px}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:30;background:rgba(12,10,8,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge)}
.topin{width:100%;max-width:1720px;margin:0 auto;padding:14px clamp(18px,2.6vw,44px);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;text-decoration:none;color:var(--ink)}
.brand b{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;font-size:25px;line-height:1;letter-spacing:-.01em}
.brand .deva{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:15px;color:var(--flame);opacity:.9}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav a{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.03em;color:var(--ink3);
  text-decoration:none;padding:6px 12px;border-radius:3px;border:1px solid transparent;transition:.13s}
nav a:hover{color:var(--ink2)}
nav a[aria-current="page"]{color:var(--flame);border-color:var(--edge2);background:var(--night2)}
nav a:focus-visible,button:focus-visible,.chip:focus-visible,input:focus-visible{
  outline:2px solid var(--flame);outline-offset:2px}

/* ---- page furniture ---- */
.page{padding-top:34px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--flame);margin-bottom:9px}
h1{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;font-size:44px;margin:0 0 14px;
  line-height:1.12;letter-spacing:-.015em;text-wrap:balance;max-width:21ch}
h1 em{font-style:italic;color:var(--flame)}
.lede{color:var(--ink2);font-size:17.5px;line-height:1.6;max-width:62ch;margin:0 0 30px}
.lede strong{color:var(--ink);font-weight:500}
h2{font-size:12px;font-weight:600;margin:0 0 14px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2)}
p{max-width:70ch}
.sub{color:var(--ink2);font-size:14.5px;line-height:1.6;max-width:72ch;margin:0 0 16px}

.panel{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:18px 20px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}

/* ---- stat strip ---- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
  background:var(--edge);border:1px solid var(--edge);border-radius:5px;overflow:hidden;margin-bottom:22px}
.cell{background:var(--panel);padding:14px 16px}
.cell .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink3)}
.cell .v{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.cell .n{font-size:12px;color:var(--ink3);margin-top:3px;font-family:"IBM Plex Mono",monospace}
.cell.f .v{color:var(--flame)}.cell.h .v{color:var(--hot)}.cell.e .v{color:var(--ember)}

/* ---- replay stage ---- */
.stage{background:linear-gradient(180deg,var(--night2),var(--panel));border:1px solid var(--edge);
  border-radius:6px;padding:18px 20px 14px;margin-bottom:16px}
.readout{display:flex;flex-wrap:wrap;gap:10px 34px;align-items:flex-end;margin-bottom:14px}
.ro .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
.ro .v{font-size:31px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.ro.day .v{color:var(--flame)}.ro.money .v{color:var(--hot)}
.ro .s{font-size:11.5px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
canvas{display:block;width:100%;height:auto;border-radius:4px}
.transport{display:flex;flex-wrap:wrap;gap:11px;align-items:center;margin-top:12px}
button{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:6px 14px;border:1px solid var(--edge2);
  border-radius:3px;background:var(--night2);color:var(--ink2);cursor:pointer;transition:.13s}
button:hover{border-color:var(--ink3);color:var(--ink)}
button.pri{border-color:var(--flame);color:var(--flame)}
button.pri:hover{background:rgba(245,177,61,.1)}
input[type=range]{flex:1;min-width:170px;accent-color:var(--flame);background:transparent}
.spd{display:flex;gap:4px}.spd button{padding:4px 9px;font-size:11px}
.spd button[aria-pressed="true"]{border-color:var(--flame);color:var(--flame)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:4px 11px;border-radius:99px;
  border:1px solid var(--edge2);background:var(--night2);color:var(--ink3);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.13s}
.chip .dot{width:8px;height:8px;border-radius:99px;background:currentColor;flex:none}
.chip[aria-pressed="true"]{color:var(--ink);border-color:currentColor}
.chip.foc{box-shadow:inset 0 0 0 1px currentColor}
.hint{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);margin-top:11px}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:8px 11px;border-bottom:1px solid var(--edge);white-space:nowrap;
  font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);font-weight:500}
tbody tr:last-child td{border-bottom:none}
td.nm{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
td.nm i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:9px;vertical-align:middle}
.bar{height:5px;border-radius:3px;min-width:2px}
.scroll{overflow-x:auto}

/* ---- misc blocks ---- */
.quote{border-left:2px solid var(--flame);padding:2px 0 2px 16px;margin:22px 0;
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;
  font-size:22px;line-height:1.45;color:var(--hot);max-width:46ch}
.stepnum{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--flame);
  line-height:1.5;opacity:.85;min-width:20px}
.step{display:flex;gap:16px;padding:14px 0;border-top:1px solid var(--edge)}
.step:first-child{border-top:none}
.step h3{margin:0 0 4px;font-size:15.5px;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:-.01em}
.step p{margin:0;color:var(--ink2);font-size:14.5px}
.ck{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink2);padding:4px 0;max-width:60ch}
.ck i{color:var(--good);font-style:normal;font-weight:700;font-size:11px}
.ck code{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 30px}
.flag{border:1px solid var(--edge2);border-left:3px solid var(--ember);background:var(--night2);
  padding:14px 18px;border-radius:0 4px 4px 0;font-size:14.5px;line-height:1.6;color:var(--ink2);
  margin:14px 0;max-width:92ch}
.flag b{color:var(--ink)}
.fixrow{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid var(--edge)}
.fixrow:first-child{border-top:none}
.fixrow .amt{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ember);font-weight:600;
  min-width:104px;text-align:right;font-variant-numeric:tabular-nums}
.fixrow .what{font-size:13.5px}
.fixrow .note{font-size:12px;color:var(--ink3);margin-top:2px}
.kind{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);border:1px solid var(--edge2);border-radius:99px;padding:1px 8px;white-space:nowrap}
footer{color:var(--ink3);font-size:12.5px;line-height:1.65;max-width:76ch;margin-top:30px;padding-top:16px;border-top:1px solid var(--edge)}
.err{padding:60px;text-align:center;color:var(--ink2)}
@media(prefers-reduced-motion:reduce){.page{animation:none}}
@media(max-width:620px){h1{font-size:32px}.ro .v{font-size:24px}nav{margin-left:0;width:100%}}
</style>
</head>

/* ============================ PAGE 1 — PROBLEM ============================ */
function classBars(){
  const cls=Object.entries(D.classes).sort((a,b)=>b[1].risk-a[1].risk);
  const max=Math.max(...cls.map(c=>c[1].risk));
  return cls.map(([k,v])=>{

    return '<div style="display:flex;align-items:center;gap:12px;padding:6px 0">'+
      '<div class="mono" style="font-size:11.5px;width:170px;color:'+(isTail?"var(--flame)":"var(--ink2)")+'">'+
      esc(isTail?"UNMAPPED TAIL":k)+'</div>'+
      '<div style="flex:1;min-width:60px"><div class="bar" style="width:'+(v.risk/max*100)+'%;height:9px;background:'+
      (isTail?"var(--flame)":"var(--dim)")+'"></div></div>'+
      '<div class="mono" style="font-size:11.5px;width:78px;text-align:right;color:var(--ink2)">'+lakh(v.risk)+'</div>'+
      '<div class="mono" style="font-size:11px;width:42px;text-align:right;color:var(--ink3)">'+v.n+'</div></div>';
  }).join("");
}
function pageProblem(){
  const naive=D.arms.naive_retry_3x;
  return '<div class="eyebrow">The problem</div>'+
  '<h1>A failed payment is not a lost payment. It is a <em>mistimed</em> one.</h1>'+
  '<p class="lede">Merchants answer failed payments by retrying — immediately, three times, identically for '+
  'every failure. But most failures carry a reason that decides <strong>when</strong> recovery is possible, '+
  'and often whether it is possible at all.</p>'+

  '<div class="strip">'+
  '<div class="cell f"><div class="k">At risk</div><div class="v">'+lakh(D.at_risk)+'</div><div class="n">300 failed payments</div></div>'+
  '<div class="cell e"><div class="k">Naive retry recovers</div><div class="v">'+pct1(naive.rate)+'</div><div class="n">'+naive.attempts+' attempts spent</div></div>'+
  '<div class="cell h"><div class="k">Actually recoverable</div><div class="v">'+pct1(D.ceiling_rate)+'</div><div class="n">if you knew every window</div></div>'+
  '<div class="cell"><div class="k">Error codes</div><div class="v">'+D.codes_total+'</div><div class="n">all real, all published</div></div>'+
  '</div>'+

  '<div class="grid2">'+
  '<div class="panel"><h2>Three failures, three different answers</h2>'+
  '<div class="step"><span class="stepnum">01</span><div><h3>insufficient_funds</h3>'+
  '<p>The account is empty. It refills on the customer&rsquo;s <b>salary date</b> — days away, not seconds. '+
  'Three retries in six minutes hit an empty account three times.</p></div></div>'+
  '<div class="step"><span class="stepnum">02</span><div><h3>bank_technical_error</h3>'+
  '<p>The issuer is down. It comes back in <b>two to five hours</b>, on its own. An immediate retry lands '+
  'inside the same outage it just failed in.</p></div></div>'+
  '<div class="step"><span class="stepnum">03</span><div><h3>card_expired</h3>'+
  '<p>The card is dead and will never clear. <b>No amount of waiting helps.</b> Every attempt spent here is '+
  'pure cost — and the naive policy spends three.</p></div></div></div>'+

  '<div class="panel"><h2>Where the money sits</h2>'+
  '<p class="sub">By failure class, across the 300-payment corpus. The largest single bucket is the '+
  '<b style="color:var(--flame)">unmapped tail</b> — '+D.tail.codes+' error codes that no hand-written rule covers.</p>'+
  classBars()+
  '<p class="sub" style="margin-top:16px">A rules table covers '+D.rules_count+' of '+D.codes_total+
  ' published Razorpay codes. Real traffic sees all of them, so a third of the money lands where the table '+
  'has nothing to say.</p></div>'+
  '</div>'+

  '<div class="quote">The question is never whether to retry. It is when, and on which channel.</div>'+
  '<p class="sub">So this project is a benchmark, not a bot. It measures recovery policies against a world '+
  'where timing decides outcomes — and it is built so that no policy, including ours, can cheat.</p>';
}

       '" font-size="11" font-family="IBM Plex Mono, monospace">'+sc.blockedLabel+'</text>';
  s+='<defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="'+CSS("--flame")+
     '" stop-opacity=".45"/><stop offset="1" stop-color="'+CSS("--flame")+'" stop-opacity=".07"/></linearGradient></defs>'+
     '<rect x="'+x(sc.blocked)+'" y="'+padT+'" width="'+(x(span)-x(sc.blocked))+'" height="46" fill="url(#wg)" rx="3"/>'+
     '<line x1="'+x(sc.blocked)+'" y1="'+(padT-6)+'" x2="'+x(sc.blocked)+'" y2="'+(padT+52)+'" stroke="'+
     CSS("--flame")+'" stroke-width="2"/>'+
     '<text x="'+(x(sc.blocked)+8)+'" y="'+(padT-12)+'" fill="'+CSS("--flame")+
     '" font-size="11" font-family="IBM Plex Mono, monospace">'+sc.openLabel+'</text>';
  const px=x(winT), inside=winT>=sc.blocked;
  const decay=Math.exp(-0.10*(winT/24));
  const p=(inside?0.90:0.02)*decay;
  s+='<line x1="'+px+'" y1="'+(padT+56)+'" x2="'+px+'" y2="'+(padT+96)+'" stroke="'+CSS("--ink")+'" stroke-width="1.5"/>'+
     '<circle cx="'+px+'" cy="'+(padT+96)+'" r="6" fill="'+(inside?CSS("--hot"):CSS("--dim"))+
     '" stroke="'+CSS("--ink")+'" stroke-width="1.5"/>'+
     '<text x="'+Math.min(px,w-padR-46)+'" y="'+(padT+88)+'" text-anchor="middle" fill="'+CSS("--ink")+
     '" font-size="11" font-family="IBM Plex Mono, monospace">your retry</text></svg>';
  return {svg:s,p:p,inside:inside,sc:sc};
}

function winWhen(){
  const h=winT;
  return h<1?(Math.round(h*60)+" min"):h<48?((+h.toFixed(1))+" h"):((h/24).toFixed(1)+" d");
}
function winReadout(v){
  return 'retry at <b style="color:var(--ink)">+'+winWhen()+'</b> → success '+
    '<b style="color:'+(v.inside?"var(--hot)":"var(--ember)")+'">'+pct1(v.p)+'</b>';
}
function winNote(v){
  return v.inside
    ? v.sc.ok+' Waiting '+(winT/24).toFixed(1)+' days has already cost you '+
      pct1(1-Math.exp(-0.10*(winT/24)))+' of the value to attrition, so later is not free either.'
    : v.sc.early;
}

function pageWindow(){
  const v=windowViz();
  return '<div class="eyebrow">The mechanic</div>'+
  '<h1>Every payment hides a <em>window</em>.</h1>'+
  '<p class="lede">It opens the moment the real blocker clears, and decays from there because customers '+
  'drift away. A policy never sees it — it has to infer when it opened, and it pays for guessing wrong '+
  '<strong>in either direction</strong>.</p>'+
  '<div class="panel"><h2>Try it — three failures where the obvious move is wrong</h2>'+
  '<div class="chips" style="margin:0 0 14px">'+SCEN.map(function(s,i){
    return '<button class="chip" data-s="'+i+'" aria-pressed="'+(i===winS)+'"'+
      (i===winS?' style="color:var(--flame)"':'')+'>'+esc(s.label)+'</button>'}).join("")+'</div>'+
  '<p class="sub" id="wblurb">'+v.sc.blurb+' Most systems would <b style="color:var(--ember)">'+
  v.sc.instinct.toLowerCase()+'</b>. Drag to see what that actually costs.</p>'+
  '<div class="scroll" id="wviz">'+v.svg+'</div>'+
  '<div class="transport" style="margin-top:6px">'+
  '<input type="range" id="wslide" min="0" max="'+v.sc.span+'" step="0.25" value="'+winT+'" '+
  'aria-label="Choose when to retry">'+
  '<div class="mono" id="wread" style="font-size:12px;color:var(--ink3);min-width:220px;text-align:right">'+
  winReadout(v)+'</div></div>'+
  '<div class="flag" id="wnote" style="margin-top:16px">'+winNote(v)+'</div></div>'+

  '<div class="grid2">'+
  '<div class="panel"><h2>Three channels, not one</h2>'+
  '<p class="sub">Each payment has up to three ways back, each with its own window.</p>'+
  '<div class="step"><span class="stepnum" style="color:var(--a1)">◆</span><div><h3>Retry</h3>'+
  '<p>Same instrument, same rail, later. Opens when the blocker clears — an outage ending, a salary '+
  'landing, a cooldown lapsing.</p></div></div>'+
  '<div class="step"><span class="stepnum" style="color:var(--a3)">◆</span><div><h3>Switch rail</h3>'+
  '<p>Move the payment to UPI. Usually open immediately, but it depends on a fixed fact about the '+
  'customer — so trying three times is worth exactly as much as trying once.</p></div></div>'+
  '<div class="step"><span class="stepnum" style="color:var(--a2)">◆</span><div><h3>Contact</h3>'+
  '<p>Ask the customer to act. The highest-friction option, and the eval charges for it: recovering more '+
  'by contacting everybody is not a better system.</p></div></div></div>'+

  '<div class="panel"><h2>Why the world cannot be gamed</h2>'+
  '<p class="sub">The obvious way to build this benchmark is rigged. If you write success probabilities '+
  'into a config keyed by failure type, you have authored the reward function that makes your own agent '+
  'win.</p>'+
  '<p class="sub">So there are exactly <b style="color:var(--flame)">six global constants</b>, none of '+
  'them keyed by failure class:</p>'+
  '<div class="mono" style="font-size:12px;color:var(--ink2);line-height:2;padding:12px 14px;'+
  'background:var(--night2);border:1px solid var(--edge);border-radius:4px">'+
  'p_in_retry <span style="color:var(--hot)">0.90</span><br>'+
  'p_in_rail <span style="color:var(--hot)">0.65</span><br>'+
  'p_in_contact <span style="color:var(--hot)">0.35</span><br>'+
  'p_out <span style="color:var(--hot)">0.02</span><br>'+
  'attrition_horizon_days <span style="color:var(--hot)">14</span><br>'+
  'attrition_lambda <span style="color:var(--hot)">0.10</span></div>'+
  '<p class="sub" style="margin-top:14px">Every difference between failure classes comes from <b>when the '+
  'window opens</b>, derived from what the failure actually is. The test suite fails the build if a '+

}

function mountWindow(){
  const redraw=function(){
    const v=windowViz();
    document.getElementById("wviz").innerHTML=v.svg;
    document.getElementById("wread").innerHTML=winReadout(v);
    document.getElementById("wnote").innerHTML=winNote(v);
  };
  document.getElementById("wslide").oninput=function(e){winT=+e.target.value;redraw()};
  document.querySelectorAll('.chip[data-s]').forEach(function(b){
    b.onclick=function(){
      winS=+b.dataset.s;
      winT=Math.min(1.5,SCEN[winS].blocked/2);
      document.querySelectorAll('.chip[data-s]').forEach(function(o){
        const on=+o.dataset.s===winS;
        o.setAttribute("aria-pressed",String(on));
        o.style.color=on?"var(--flame)":"";
      });
      const sc=SCEN[winS];
      document.getElementById("wblurb").innerHTML=sc.blurb+' Most systems would <b style="color:var(--ember)">'+
        sc.instinct.toLowerCase()+'</b>. Drag to see what that actually costs.';
      const sl=document.getElementById("wslide");
      sl.max=String(sc.span); sl.value=String(winT);
      redraw();
    };
  });
}

/* ============================ PAGE 3 — REPLAY ============================ */
const LAY={w:1120,h:520,raceH:274,padL:78,padR:158,padT:26,gridTop:382};
function draw(){
  if(!ctx)return;
  const w=LAY.w;ctx.clearRect(0,0,w,LAY.h);
  const span=D.span_h,t=S.t;
  const x=hr=>LAY.padL+(hr/span)*(w-LAY.padL-LAY.padR);
  const maxY=Math.max(D.ceiling,...Object.values(D.arms).map(a=>a.total))*1.04;
  const y=v=>LAY.padT+LAY.raceH-(v/maxY)*LAY.raceH;
  ctx.font='10px "IBM Plex Mono", monospace';ctx.textAlign="center";
  const totalDays=span/24, stepD=totalDays>24?5:(totalDays>12?2:1);
  for(let d=0;d<=totalDays;d+=stepD){const px=x(d*24);
    ctx.strokeStyle="rgba(255,255,255,.05)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px,LAY.padT-6);ctx.lineTo(px,LAY.padT+LAY.raceH);ctx.stroke();
    ctx.fillStyle=CSS("--ink3");ctx.fillText("day "+d,px,LAY.padT+LAY.raceH+17);}
  // Failures stop arriving well before the clock stops -- everything after this
  // line is recovery work on payments that already failed.
  const lastFail=Math.max.apply(null,D.payments.map(function(q){return q.t}));
  const lfx=x(lastFail);
  ctx.setLineDash([2,3]);ctx.strokeStyle="rgba(255,255,255,.16)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(lfx,LAY.padT-6);ctx.lineTo(lfx,LAY.padT+LAY.raceH);ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign="left";ctx.fillStyle=CSS("--ink3");ctx.font='9.5px "IBM Plex Mono", monospace';
  ctx.fillText("last failure arrives",lfx+6,LAY.padT+6);
  ctx.font='10px "IBM Plex Mono", monospace';ctx.textAlign="center";
  ctx.textAlign="right";
  for(let i=0;i<=3;i++){const v=maxY/3*i;
    ctx.fillStyle=CSS("--ink3");ctx.fillText(lakh(v),LAY.padL-10,y(v)+3);
    ctx.strokeStyle="rgba(255,255,255,.04)";
    ctx.beginPath();ctx.moveTo(LAY.padL,y(v));ctx.lineTo(w-LAY.padR,y(v));ctx.stroke();}
  ctx.setLineDash([5,4]);ctx.strokeStyle="rgba(246,241,232,.42)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(LAY.padL,y(D.ceiling));ctx.lineTo(w-LAY.padR,y(D.ceiling));ctx.stroke();
  ctx.setLineDash([]);ctx.textAlign="left";ctx.fillStyle=CSS("--ink2");
  ctx.fillText("oracle ceiling "+lakh(D.ceiling),LAY.padL+6,y(D.ceiling)-7);
  const ends=[];
  D.order.forEach(name=>{
    if(!S.on.has(name))return;
    const a=D.arms[name],col=CSS(HUE[name]);
    let sum=0,py=y(0);
    ctx.beginPath();ctx.moveTo(LAY.padL,py);
    ctx.lineWidth=name===S.focus?2.6:1.6;ctx.strokeStyle=col;ctx.globalAlpha=name===S.focus?1:.72;
    for(const wi of a.wins){if(wi[0]>t)break;const nx=x(wi[0]);
      ctx.lineTo(nx,py);sum+=wi[2];py=y(sum);ctx.lineTo(nx,py);}
    ctx.lineTo(x(t),py);ctx.stroke();ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(x(t),py,name===S.focus?4.5:3,0,7);ctx.fillStyle=col;ctx.fill();
    ends.push({name,y:py,col});
  });
  ends.sort((p,q)=>p.y-q.y);
  for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13;
  ctx.textAlign="left";ctx.font='10.5px "IBM Plex Mono", monospace';
  ends.forEach(e=>{ctx.fillStyle=e.col;ctx.fillText(e.name.replace(/_/g," "),w-LAY.padR+8,e.y+3)});
  const f=D.arms[S.focus],cols=30,cell=(w-LAY.padL-LAY.padR)/cols,r=3.1;
  const lit=new Map();for(const wi of f.wins){if(wi[0]>t)break;lit.set(wi[1],wi[0])}
  const recent=new Map();for(const fi of f.fires){if(fi[0]>t)break;if(t-fi[0]<6&&!fi[2])recent.set(fi[1],fi[0])}
  ctx.textAlign="left";ctx.font='9.5px "IBM Plex Mono", monospace';ctx.fillStyle=CSS("--ink3");
  ctx.fillText("each lamp is one failed payment · lit when "+S.focus.replace(/_/g," ")+" recovers it",LAY.padL,LAY.gridTop-16);
  for(let i=0;i<D.payments.length;i++){
    const p=D.payments[i],cx=LAY.padL+(i%cols)*cell+cell/2,cy=LAY.gridTop+Math.floor(i/cols)*11+6;
    if(p.t>t){ctx.beginPath();ctx.arc(cx,cy,1.4,0,7);ctx.fillStyle="rgba(255,255,255,.06)";ctx.fill();continue}
    const at=lit.get(i);
    if(at!==undefined){
      const ig=Math.min(1,(t-at)/4);
      const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,7.5);
      gr.addColorStop(0,"rgba(255,217,138,"+(.95-ig*.2)+")");
      gr.addColorStop(.42,"rgba(245,177,61,"+(.55-ig*.18)+")");
      gr.addColorStop(1,"rgba(245,177,61,0)");
      ctx.beginPath();ctx.arc(cx,cy,7.5,0,7);ctx.fillStyle=gr;ctx.fill();
      ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle=CSS("--hot");ctx.fill();
    }else if(recent.has(i)){
      const fade=1-(t-recent.get(i))/6;
      ctx.beginPath();ctx.arc(cx,cy,r+1.4,0,7);
      ctx.strokeStyle="rgba(224,102,58,"+(fade*.75)+")";ctx.lineWidth=1.3;ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,r-.7,0,7);ctx.fillStyle=CSS("--dim");ctx.fill();
    }else{ctx.beginPath();ctx.arc(cx,cy,r-.7,0,7);ctx.fillStyle=CSS("--dim");ctx.fill()}
  }
  ctx.strokeStyle="rgba(245,177,61,.5)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x(t),LAY.padT-6);ctx.lineTo(x(t),LAY.padT+LAY.raceH+2);ctx.stroke();
}
function readout(){
  const f=D.arms[S.focus];let sum=0,n=0,att=0;
  for(const wi of f.wins){if(wi[0]>S.t)break;sum+=wi[2];n++}
  for(const fi of f.fires){if(fi[0]>S.t)break;att++}
  const g=id=>document.getElementById(id);
  if(!g("day"))return;
  g("day").textContent="d"+(S.t/24).toFixed(1);
  g("rec").textContent=money(sum);
  g("recs").textContent=n+" of 300 payments · "+att+" attempts spent";
  g("rate").textContent=pct(sum/D.at_risk);
  g("scrub").value=String(S.t);
}
let last=0;
function frame(ts){
  if(!last)last=ts;const dt=(ts-last)/1000;last=ts;
  if(S.playing&&ctx){S.t+=dt*(D.span_h/20)*S.speed;
    if(S.t>=D.span_h){S.t=D.span_h;S.playing=false;syncBtn()}}
  if(ctx){draw();readout()}
  raf=requestAnimationFrame(frame);
}
function syncBtn(){const b=document.getElementById("play");if(b)
  b.textContent=S.playing?"❚❚  Pause":(S.t>=D.span_h?"↻  Replay":"▶  Play")}
function pageReplay(){
  return '<div class="eyebrow">The replay</div>'+

  '<p class="lede">Failures arrive over the first fourteen days. Each one then stays recoverable for up '+

  '<div class="stage"><div class="readout">'+

  '<div class="s">of '+(D.span_h/24).toFixed(0)+' days</div></div>'+
  '<div class="ro money"><div class="k">Recovered by focus arm</div><div class="v" id="rec">₹0</div>'+
  '<div class="s" id="recs">—</div></div>'+
  '<div class="ro"><div class="k">Rate</div><div class="v" id="rate">0.00%</div>'+
  '<div class="s">of '+money(D.at_risk)+' at risk</div></div></div>'+
  '<canvas id="cv" width="'+LAY.w+'" height="'+LAY.h+'" role="img" '+
  'aria-label="A month replayed: cumulative recovery per policy, and a lamp per payment lit when recovered"></canvas>'+
  '<div class="transport"><button id="play" class="pri">▶  Play</button>'+
  '<button id="restart">↻  Restart</button>'+
  '<input type="range" id="scrub" min="0" max="'+D.span_h+'" step="0.5" value="0" aria-label="Scrub through time">'+
  '<div class="spd">'+[0.5,1,2,4].map(s=>'<button data-s="'+s+'" aria-pressed="'+(s===1)+'">'+s+'×</button>').join("")+'</div></div>'+
  '<div class="chips" id="chips">'+D.order.map(n=>
    '<button class="chip'+(n===S.focus?" foc":"")+'" data-arm="'+esc(n)+'" aria-pressed="'+S.on.has(n)+'"'+
    (S.on.has(n)?' style="color:var('+HUE[n]+')"':'')+'><i class="dot"></i>'+esc(n)+'</button>').join("")+'</div>'+
  '<p class="hint">Click an arm to show or hide its line · click again to focus it and light its lamps</p></div>';
}

/* ============================ PAGE 4 — ARMS ============================ */

    return '<div style="padding:7px 0"><div class="mono" style="font-size:11.5px;color:var(--ink2);margin-bottom:4px">'+
      esc(n)+' <span style="color:var(--ink3)">· '+tot+' attempts</span></div>'+
      '<div style="display:flex;gap:2px;border-radius:3px;overflow:hidden">'+

      seg(t.late,"var(--a3)","too late")+seg(t.nowin,"var(--dim)","no window")+'</div></div>';
  }).join("");
}

/* ============================ PAGE 5 — INTEGRITY ============================ */
const CHECKS=[["L1","no window-shaped field on the visible record"],
["L2","no window-shaped key at any depth in the corpus"],
["L3","no visible value equals a delayed window boundary"],
["L4","object-graph walk from policy inputs reaches no truth"],
["L5","only the executor and reporters import ground truth"],
["L5a","policies and classifiers can never be whitelisted"],
["L6","no diagnosis field leaks a boundary, free text included"],
["L7","no visible categorical field determines the answer"],
["L8","adversarial getattr probe over ~40 names finds nothing"],
["L9","the LLM prompt leaks no window, amount or timestamp"],
["L10","every whitelisted field actually reaches the prompt"],
["L11","cache key depends on the reason, never the payment"],
["L12","all 51 cached verdicts record their provenance"],
["L13","every LLM diagnosis is a rule hit or a cached verdict"]];
function sensTable(){
  if(!D.sensitivity)return'<p class="sub">Run <span class="mono">scripts.sensitivity --json</span> to populate this.</p>';
  const sc=D.sensitivity.scenarios;
  const wins=sc.filter(s=>s.llm_wins).length,probe=sc.filter(s=>s.probe_loses).length;
  return '<div style="display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px">'+
   '<div><div class="k mono" style="font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)">Probe never wins</div>'+
   '<div style="font-size:25px;font-weight:600;color:var(--good)">'+probe+' / '+sc.length+'</div></div>'+
   '<div><div class="k mono" style="font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)">LLM beats rules</div>'+
   '<div style="font-size:25px;font-weight:600;color:var(--ember)">'+wins+' / '+sc.length+'</div></div></div>'+
   '<div class="scroll"><table><thead><tr><th>Scenario</th><th>llm</th><th>rules</th><th>Δ</th><th>Holds</th></tr></thead><tbody>'+
   sc.map(s=>{const d=s.scores.llm_recommended-s.scores.rules_recommended;
     return '<tr><td class="mono" style="font-size:11.5px">'+esc(s.label)+'</td>'+
     '<td>'+lakh(s.scores.llm_recommended)+'</td><td>'+lakh(s.scores.rules_recommended)+'</td>'+
     '<td style="color:'+(d>=0?"var(--good)":"var(--ember)")+'">'+(d>=0?"+":"")+lakh(Math.abs(d)).replace("₹","₹")+'</td>'+
     '<td class="mono" style="color:'+(s.llm_wins?"var(--good)":"var(--ember)")+'">'+(s.llm_wins?"yes":"NO")+'</td></tr>';
   }).join("")+'</tbody></table></div>';
}
function pageIntegrity(){
  const probe=D.arms.max_wait_probe;
  const totalFix=D.fixes.reduce((a,f)=>a+f.paise,0);
  return '<div class="eyebrow">Integrity</div>'+
  '<h1>The benchmark is built so <em>we</em> cannot cheat either.</h1>'+
  '<p class="lede">If a policy could read the hidden windows, every number here would be meaningless. So the '+
  'assertions are written to be adversarial rather than reassuring — and they caught us three times.</p>'+

  '<div class="panel"><h2>Three times, the &ldquo;AI headroom&rdquo; was our own bug</h2>'+
  '<p class="sub">Each was found by diffing every policy against a perfect-knowledge oracle, and each was '+
  'fixed <b>before</b> the LLM was measured — making the control stronger and the final AI number smaller.</p>'+
  D.fixes.map(f=>'<div class="fixrow"><div class="amt">'+lakh(f.paise)+'</div>'+
    '<div style="flex:1"><div class="what">'+esc(f.what)+'</div>'+
    '<div class="note">'+esc(f.note)+'</div></div><span class="kind">'+esc(f.kind)+'</span></div>').join("")+
  '<div class="flag"><b>'+money(totalFix)+' the AI arm would otherwise have banked without inferring '+
  'anything.</b> The worst was the fallback: escalating every unmapped code made the whole tail score 0.0% '+
  'and look like a gap only AI could close.</div></div>'+

  '<div class="grid2">'+
  '<div class="panel"><h2>The degeneracy probe</h2>'+
  '<p class="sub">If windows only closed at a fixed horizon, one attempt just before it would land inside '+
  '<i>every</i> window and beat everything with zero inference.</p>'+
  '<div style="display:flex;gap:26px;flex-wrap:wrap;margin:14px 0">'+
  '<div><div class="mono" style="font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)">In-window attempts</div>'+
  '<div style="font-size:25px;font-weight:600;color:var(--flame)">'+probe.timing.in+'</div>'+
  '<div class="mono" style="font-size:11px;color:var(--ink3)">more than most arms</div></div>'+
  '<div><div class="mono" style="font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)">Final position</div>'+
  '<div style="font-size:25px;font-weight:600;color:var(--ember)">last</div>'+
  '<div class="mono" style="font-size:11px;color:var(--ink3)">'+pct(probe.rate)+' recovered</div></div></div>'+
  '<p class="sub">It lands in more windows than almost anything else and still finishes last, because '+
  'attrition means a 13.9-day-old recovery keeps only a quarter of its value. <b>The build fails if it ever '+
  'wins.</b></p></div>'+

  '<div class="panel"><h2>Thirteen leak assertions</h2>'+
  '<p class="sub"><i>Inferring</i> a window from semantics is the skill under test. <i>Reading</i> a boundary '+
  'off a field is cheating. These test the second without forbidding the first.</p>'+
  '<div class="checks">'+CHECKS.map(c=>'<div class="ck"><i>✓</i><span><code>'+c[0]+'</code> '+c[1]+'</span></div>').join("")+'</div>'+
  '</div></div>'+

  '<div class="panel"><h2>Sensitivity — does the ranking survive our assumptions being wrong?</h2>'+
  '<p class="sub">Every world constant perturbed by ±40%, one at a time and jointly. One claim holds '+
  'everywhere; the other does not, and that is reported rather than hidden.</p>'+
  sensTable()+
  '<div class="flag" style="border-left-color:var(--ember)"><b>The LLM&rsquo;s advantage is conditional, not '+
  'robust.</b> It inverts when the retry channel is materially weaker than assumed. The degeneracy '+
  'guarantee, by contrast, holds under every perturbation tested.</div></div>';
}

/* ============================ PAGE — ADVISOR ============================ */
const ALL_REASONS=["insufficient_funds","bank_technical_error","card_expired","incorrect_otp",
"gateway_technical_error","payment_risk_check_failed","invalid_vpa","vpa_resolution_failed",
"mandate_creation_failed","otp_attempts_exceeded","transaction_daily_limit_exceeded",
"order_already_paid","deemed_transaction","debit_instrument_blocked","psp_app_not_supported",
"card_declined","payment_timed_out","international_transaction_not_allowed","credit_limit_exceeded",
"merchant_not_activated","collect_request_pending","beneficiary_account_dormant"];

function adviceCard(a){
  if(!a)return '<div class="panel"><p class="sub">Pick an error code to get a decision.</p></div>';
  const llm=a.decided_by.indexOf("LLM")===0;
  const when=a.retry_at?new Date(a.retry_at):null;
  return '<div class="panel" style="border-color:var(--edge2)">'+
   '<div style="display:flex;flex-wrap:wrap;gap:10px 20px;align-items:baseline;margin-bottom:6px">'+
   '<div style="font-family:Source Serif 4,Georgia,serif;font-size:27px;color:var(--hot)">'+esc(a.verdict)+'</div>'+
   '<span class="kind" style="border-color:'+(llm?"var(--a1)":"var(--edge2)")+';color:'+(llm?"var(--a1)":"var(--ink3)")+'">'+
   esc(a.decided_by)+(a.rule_id?" · "+esc(a.rule_id):"")+'</span>'+
   '<span class="kind">'+esc(a.failure_class)+'</span>'+
   '<span class="kind" style="color:'+(a.retriable?"var(--good)":"var(--ember)")+'">'+
   (a.retriable?"retriable":"not retriable on this rail")+'</span></div>'+
   '<p class="sub" style="margin-bottom:16px">'+esc(a.why)+'</p>'+

   '<div class="strip" style="margin-bottom:18px">'+
   '<div class="cell f"><div class="k">Action</div><div class="v" style="font-size:15px;font-family:IBM Plex Mono,monospace">'+
   esc(a.action)+'</div><div class="n">from the '+(llm?"model":"rules table")+'</div></div>'+
   '<div class="cell h"><div class="k">Retry</div><div class="v" style="font-size:19px">'+esc(a.retry_in_words)+'</div>'+
   '<div class="n">'+(when?esc(when.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})):"nothing to schedule")+'</div></div>'+
   '<div class="cell"><div class="k">Contacts customer</div><div class="v" style="font-size:19px;color:'+
   (a.contacts_customer?"var(--ember)":"var(--good)")+'">'+(a.contacts_customer?"yes":"no")+'</div>'+
   '<div class="n">'+(a.contacts_customer?"costs goodwill":"silent recovery")+'</div></div>'+
   '<div class="cell"><div class="k">Confidence</div><div class="v" style="font-size:19px">'+a.confidence.toFixed(2)+'</div>'+
   '<div class="n">'+(a.confidence>=0.9?"definitional":"model estimate")+'</div></div></div>'+

   '<div class="grid2">'+
   '<div><h2>For the merchant</h2>'+
   a.merchant_steps.map(function(x,i){return '<div class="step" style="padding:9px 0"><span class="stepnum" style="font-size:20px">'+
     (i+1)+'</span><div><p style="margin:0">'+esc(x)+'</p></div></div>'}).join("")+
   '<div style="margin-top:14px"><div class="mono" style="font-size:10.5px;letter-spacing:.11em;'+
   'text-transform:uppercase;color:var(--ember);margin-bottom:6px">Do not</div>'+
   a.avoid.map(function(x){return '<div class="ck" style="align-items:flex-start"><i style="color:var(--ember)">×</i>'+
     '<span>'+esc(x)+'</span></div>'}).join("")+'</div></div>'+

   '<div><h2>For the customer</h2>'+
   (a.customer_message
     ? '<div style="background:var(--night2);border:1px solid var(--edge);border-radius:5px;padding:15px 17px">'+
       '<div class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)">Subject</div>'+
       '<div style="font-weight:600;margin:3px 0 12px">'+esc(a.customer_subject)+'</div>'+
       '<div class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)">Message</div>'+
       '<p style="margin:4px 0 0;color:var(--ink2);font-size:13.5px">'+esc(a.customer_message)+'</p></div>'+
       (a.contacts_customer
         ? '<p class="sub" style="margin-top:12px;font-size:12.5px">This action spends a <b>customer contact</b>. '+
           'The benchmark charges for it — recovering more by messaging everybody is not a better system. Send once.</p>'
         : '<p class="sub" style="margin-top:12px;font-size:12.5px">Informational only. Recovery happens without '+
           'asking the customer for anything.</p>')
     : '<div class="flag" style="margin:0"><b>Say nothing.</b> This is not the customer&rsquo;s problem to solve, '+
       'and messaging them about it would only cause confusion.</div>')+
   '</div></div>'+

   '<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--edge)">'+
   '<div class="mono" style="font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px">Diagnosis trail</div>'+
   '<p class="sub mono" style="font-size:11.5px;margin:0">'+esc(a.diagnosis_note)+'</p></div></div>';
}

let REASONS_RULES=[], REASONS_LLM=[];
function buildReasonLists(){
  const adv=(D&&D.advice)||{};
  REASONS_RULES=[];REASONS_LLM=[];
  Object.keys(adv).sort().forEach(function(r){
    (adv[r].rule_id?REASONS_RULES:REASONS_LLM).push(r);
  });
  if(!adv[ADV_REASON])ADV_REASON=REASONS_RULES[0]||REASONS_LLM[0]||"";
}
function reasonOptions(){
  const opt=function(r){return '<option value="'+esc(r)+'"'+(r===ADV_REASON?" selected":"")+'>'+esc(r)+'</option>'};
  return '<optgroup label="Covered by the rules table ('+REASONS_RULES.length+')">'+
    REASONS_RULES.map(opt).join("")+'</optgroup>'+
    '<optgroup label="Unmapped — answered by the model ('+REASONS_LLM.length+')">'+
    REASONS_LLM.map(opt).join("")+'</optgroup>';
}

function pageAdvisor(){
  buildReasonLists();
  return '<div class="eyebrow">Advisor</div>'+
  '<h1>A payment just failed. <em>Now what?</em></h1>'+
  '<p class="lede">Give it the error code and it returns a decision: what went wrong, whether it can be '+
  'recovered at all, <strong>when</strong> to try, and what to say to the customer. This is the winning '+
  'policy with a front door on it — it sees only what the benchmark let it see.</p>'+
  '<div class="panel"><h2>The failed payment</h2>'+
  '<div class="transport" style="margin-top:0">'+
  '<label class="mono" style="font-size:11px;color:var(--ink3)">error code</label>'+
  '<select id="areason" style="flex:1;min-width:260px;font-family:IBM Plex Mono,monospace;font-size:13px;'+
  'padding:8px 11px;border:1px solid var(--edge2);border-radius:3px;background:var(--night2);color:var(--ink)">'+
  reasonOptions()+'</select>'+
  '<label class="mono" style="font-size:11px;color:var(--ink3)">prior failures</label>'+
  '<select id="aprior" style="font-family:IBM Plex Mono,monospace;font-size:12px;padding:8px 9px;'+
  'border:1px solid var(--edge2);border-radius:3px;background:var(--night2);color:var(--ink)">'+
  [0,1,2,3].map(function(n){return '<option value="'+n+'"'+(n===ADV_PRIOR?" selected":"")+'>'+n+'</option>'}).join("")+'</select>'+
  '</div>'+
  '<p class="hint">All '+(REASONS_RULES.length+REASONS_LLM.length)+' published Razorpay reasons · '+
  REASONS_RULES.length+' answered by the rules table, '+REASONS_LLM.length+' by the model</p></div>'+
  '<div id="aout">'+adviceCard(ADV)+'</div>';
}

function mountAdvisor(){
  const go=function(){
    const r=document.getElementById("areason").value;
    ADV_PRIOR=+document.getElementById("aprior").value;
    if(!r)return;
    ADV_REASON=r;
    document.getElementById("aout").innerHTML='<div class="panel"><p class="sub mono">Diagnosing '+esc(r)+'…</p></div>';
    const base=D.advice&&D.advice[r];
    if(!base){document.getElementById("aout").innerHTML=
      '<div class="panel"><p class="sub">No advice for <b>'+esc(r)+'</b>.</p></div>';return}
    const a=JSON.parse(JSON.stringify(base));
    if(ADV_PRIOR&&a.wait_hours>0){
      a.wait_hours=+(a.wait_hours*Math.pow(1.6,Math.min(ADV_PRIOR,3))).toFixed(2);
      const hh=a.wait_hours;
      a.retry_in_words=hh<1?("in about "+Math.round(hh*60)+" minutes"):
        hh<48?("in about "+(+hh.toFixed(1))+" hours"):("in about "+Math.round(hh/24)+" days");
      a.retry_at=new Date(Date.now()+hh*36e5).toISOString();
    }
    ADV=a;document.getElementById("aout").innerHTML=adviceCard(a);mountAdvisor();
  };
  document.getElementById("areason").onchange=go;
  document.getElementById("aprior").onchange=go;
  if(!ADV||ADV.reason!==ADV_REASON)go();
}

/* ============================ ROUTER ============================ */
const RENDER={problem:pageProblem,window:pageWindow,advisor:pageAdvisor,replay:pageReplay,arms:pageArms,integrity:pageIntegrity};
function route(){
  const id=(location.hash||"#problem").slice(1);
  const page=RENDER[id]?id:"problem";
  ctx=null;
  document.getElementById("root").innerHTML='<div class="page">'+RENDER[page]()+
    '<footer>Seed '+D.seed+' · 300 failed payments built from '+D.codes_total+' real published Razorpay error '+
    'codes · 88 assertions passing. The executor is simulated, so every rupee is modelled rather than '+
    'settled. Method and limitations in full in the repository README.</footer></div>';
  document.querySelectorAll("#nav a").forEach(a=>
    a.setAttribute("aria-current",a.dataset.p===page?"page":"false"));
  if(page==="replay")mountReplay();
  if(page==="window")mountWindow();
  if(page==="advisor")mountAdvisor();
  window.scrollTo({top:0,behavior:"instant"});
}
function mountReplay(){
  const C=document.getElementById("cv");
  const dpr=Math.min(2,window.devicePixelRatio||1);
  C.width=LAY.w*dpr;C.height=LAY.h*dpr;C.style.aspectRatio=LAY.w+" / "+LAY.h;
  ctx=C.getContext("2d");ctx.scale(dpr,dpr);
  document.getElementById("play").onclick=()=>{if(S.t>=D.span_h)S.t=0;S.playing=!S.playing;syncBtn()};
  document.getElementById("restart").onclick=()=>{S.t=0;S.playing=true;syncBtn()};
  document.getElementById("scrub").oninput=e=>{S.t=+e.target.value;S.playing=false;syncBtn()};
  document.querySelectorAll(".spd button").forEach(b=>b.onclick=()=>{S.speed=+b.dataset.s;
    document.querySelectorAll(".spd button").forEach(o=>o.setAttribute("aria-pressed",String(o===b)))});
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{
    const n=b.dataset.arm;
    if(!S.on.has(n)){S.on.add(n);S.focus=n}
    else if(S.focus!==n){S.focus=n}
    else if(S.on.size>1){S.on.delete(n);S.focus=[...S.on][0]}
    document.querySelectorAll("#chips .chip").forEach(c=>{
      const m=c.dataset.arm,on=S.on.has(m);
      c.setAttribute("aria-pressed",String(on));
      c.style.color=on?"var("+HUE[m]+")":"";
      c.classList.toggle("foc",m===S.focus)});
  });
  // Show the finished state, then rewind — a still frame is never an empty chart.
  S.t=D.span_h;draw();readout();
  setTimeout(()=>{S.t=0;S.playing=true;syncBtn()},700);
}
function boot(d){
  D=d;D.order.forEach((n,i)=>HUE[n]=SLOTS[i%SLOTS.length]);
  if(!D.arms[S.focus])S.focus=D.order[0];
  S.on=new Set(DEFAULT_ON.filter(n=>D.arms[n]));if(!S.on.size)S.on=new Set([D.order[0]]);
  document.getElementById("nav").innerHTML=PAGES.map(p=>
    '<a href="#'+p[0]+'" data-p="'+p[0]+'">'+p[1]+'</a>').join("");
  window.addEventListener("hashchange",route);
  route();
  raf=requestAnimationFrame(frame);
}
boot(JSON.parse(document.getElementById("rep").textContent));
</script>
</body>
</html>
