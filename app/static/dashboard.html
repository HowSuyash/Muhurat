<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhurat — Recovery Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* A committed single-theme design: this is a night scene, and the ignition
   glow only reads on a dark ground. Every colour is painted explicitly so the
   page holds regardless of the host theme. */
:root{
  color-scheme:dark;
  --night:#0c0a08; --night-2:#141110; --panel:#17140f; --edge:#2a251e;
  --ink:#f6f1e8; --ink2:#b9b1a3; --ink3:#7d766a;
  --flame:#f5b13d; --flame-hot:#ffd98a;
  --a1:#4a94ee; --a2:#e0663a; --a3:#22b183; --a4:#d55181; --a5:#9085e9; --a6:#e66767; --a7:#c98500;
  --dim:#3a342c;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{margin:0;color:var(--ink);
  font:14.5px/1.55 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:30px 22px 70px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:6px}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:44px;margin:0;line-height:1;
   letter-spacing:.005em}
.deva{font-family:"Instrument Serif",Georgia,serif;font-size:23px;color:var(--flame);opacity:.85}
.tag{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
.thesis{color:var(--ink2);margin:6px 0 24px;max-width:68ch;font-size:15px}
.thesis em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:17.5px;color:var(--flame-hot)}

/* stage */
.stage{background:linear-gradient(180deg,var(--night-2),var(--panel));
  border:1px solid var(--edge);border-radius:6px;padding:18px 20px 14px;margin-bottom:16px}
.readout{display:flex;flex-wrap:wrap;gap:10px 34px;align-items:flex-end;margin-bottom:14px}
.ro .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3)}
.ro .v{font-size:31px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.ro.day .v{color:var(--flame)}
.ro.money .v{color:var(--flame-hot)}
.ro .s{font-size:11.5px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
canvas{display:block;width:100%;height:auto;border-radius:4px}

/* transport */
.transport{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
button{font:inherit;font-family:"IBM Plex Mono",monospace;font-size:12px;padding:6px 14px;
  border:1px solid var(--edge);border-radius:3px;background:var(--night-2);color:var(--ink2);cursor:pointer;
  transition:border-color .12s,color .12s}
button:hover{border-color:var(--ink3);color:var(--ink)}
button.pri{border-color:var(--flame);color:var(--flame)}
button.pri:hover{background:rgba(245,177,61,.1)}
button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
input[type=range]{flex:1;min-width:180px;accent-color:var(--flame);background:transparent}
.spd{display:flex;gap:4px}
.spd button{padding:4px 9px;font-size:11px}
.spd button[aria-pressed="true"]{border-color:var(--flame);color:var(--flame)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:4px 11px;border-radius:99px;
  border:1px solid var(--edge);background:var(--night-2);color:var(--ink3);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:all .12s}
.chip .dot{width:8px;height:8px;border-radius:99px;background:currentColor;flex:none}
.chip[aria-pressed="true"]{color:var(--ink);border-color:currentColor}
.chip.focus{box-shadow:inset 0 0 0 1px currentColor}
.hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);margin-top:10px}

/* standings */
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:16px 20px;margin-bottom:16px}
h2{font-size:11.5px;font-weight:600;margin:0 0 12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px 11px;border-bottom:1px solid var(--edge);white-space:nowrap;
  font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);font-weight:500}
tbody tr:last-child td{border-bottom:none}
td.nm{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
td.nm i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:9px}
.bar{height:5px;border-radius:3px;min-width:2px}
footer{color:var(--ink3);font-size:12px;max-width:76ch;margin-top:22px}
.scroll{overflow-x:auto}
.err{padding:50px;text-align:center;color:var(--ink2)}
@media(prefers-reduced-motion:reduce){#play{display:none}}
@media(max-width:620px){h1{font-size:34px}.ro .v{font-size:25px}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="err mono">Loading replay…</div></div>
<script>
const R="₹";
const money=p=>R+Math.round(p/100).toLocaleString("en-IN");
const short=p=>{const r=p/100;return r>=1e5?R+(r/1e5).toFixed(2)+"L":R+Math.round(r).toLocaleString("en-IN")};
const pct=v=>(v*100).toFixed(2)+"%";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CSS=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let D=null, C=null, ctx=null;
// Colour is bound to the arm name, so toggling never repaints a survivor.
const HUE={}, SLOTS=["--a1","--a2","--a3","--a4","--a5","--a6","--a7"];
// Three lines by default: past three, adjacent hues stop being reliably
// separable for colour-blind viewers, so extra arms are opt-in and every line
// is also labelled directly at its endpoint.
const DEFAULT_ON=["naive_retry_3x","rules_recommended","llm_recommended"];

const S={on:new Set(DEFAULT_ON), focus:"llm_recommended", t:0, playing:true, speed:1};

/* ---------------- the replay canvas ---------------- */
const LAY={w:1120,h:520,raceH:274,padL:78,padR:158,padT:26,gridTop:382};

function draw(){
  const w=LAY.w,h=LAY.h;
  ctx.clearRect(0,0,w,h);
  const span=D.span_h, t=S.t;
  const x=hr=>LAY.padL+(hr/span)*(w-LAY.padL-LAY.padR);
  const maxY=Math.max(D.ceiling, ...Object.values(D.arms).map(a=>a.total))*1.04;
  const y=v=>LAY.padT+LAY.raceH-(v/maxY)*LAY.raceH;

  // --- day grid ------------------------------------------------------------
  ctx.font='10px "IBM Plex Mono", monospace'; ctx.textAlign="center";
  for(let d=0;d<=14;d+=2){
    const px=x(d*24);
    ctx.strokeStyle="rgba(255,255,255,.05)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(px,LAY.padT-6); ctx.lineTo(px,LAY.padT+LAY.raceH); ctx.stroke();
    ctx.fillStyle=CSS("--ink3"); ctx.fillText("day "+d,px,LAY.padT+LAY.raceH+17);
  }
  // rupee axis
  ctx.textAlign="right";
  for(let i=0;i<=3;i++){
    const v=maxY/3*i;
    ctx.fillStyle=CSS("--ink3"); ctx.fillText(short(v),LAY.padL-10,y(v)+3);
    ctx.strokeStyle="rgba(255,255,255,.04)";
    ctx.beginPath(); ctx.moveTo(LAY.padL,y(v)); ctx.lineTo(w-LAY.padR,y(v)); ctx.stroke();
  }
  // ceiling
  ctx.setLineDash([5,4]); ctx.strokeStyle="rgba(246,241,232,.42)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(LAY.padL,y(D.ceiling)); ctx.lineTo(w-LAY.padR,y(D.ceiling)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign="left"; ctx.fillStyle=CSS("--ink2");
  ctx.fillText("oracle ceiling "+short(D.ceiling),LAY.padL+6,y(D.ceiling)-7);

  // --- cumulative recovery lines ------------------------------------------
  const ends=[];
  D.order.forEach(name=>{
    if(!S.on.has(name))return;
    const a=D.arms[name], col=CSS(HUE[name]);
    let sum=0, px=LAY.padL, py=y(0);
    ctx.beginPath(); ctx.moveTo(px,py);
    ctx.lineWidth=name===S.focus?2.6:1.6;
    ctx.strokeStyle=col;
    ctx.globalAlpha=name===S.focus?1:.72;
    for(const wi of a.wins){
      if(wi[0]>t)break;
      const nx=x(wi[0]);
      ctx.lineTo(nx,py);          // step: money lands at an instant
      sum+=wi[2]; py=y(sum);
      ctx.lineTo(nx,py);
    }
    ctx.lineTo(x(t),py); ctx.stroke();
    ctx.globalAlpha=1;
    // endpoint marker + direct label -- identity never rests on colour alone
    ctx.beginPath(); ctx.arc(x(t),py,name===S.focus?4.5:3,0,7); ctx.fillStyle=col; ctx.fill();
    ends.push({name,y:py,col,sum});
  });
  // de-collide the endpoint labels
  ends.sort((p,q)=>p.y-q.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;
  ctx.textAlign="left"; ctx.font='10.5px "IBM Plex Mono", monospace';
  ends.forEach(e=>{
    ctx.fillStyle=e.col;
    ctx.fillText(e.name.replace(/_/g," "),w-LAY.padR+8,e.y+3);
  });

  // --- the lamp field: one dot per payment, lit when the focus arm wins ----
  const f=D.arms[S.focus];
  const cols=30, cell=(w-LAY.padL-LAY.padR)/cols, r=3.1;
  const lit=new Map();
  for(const wi of f.wins){ if(wi[0]>t)break; lit.set(wi[1],wi[0]); }
  // recent misses flare briefly, so you can see effort being spent
  const recent=new Map();
  for(const fi of f.fires){ if(fi[0]>t)break; if(t-fi[0]<6&&!fi[2]) recent.set(fi[1],fi[0]); }

  ctx.textAlign="left"; ctx.font='9.5px "IBM Plex Mono", monospace';
  ctx.fillStyle=CSS("--ink3");
  ctx.fillText("each lamp is one failed payment · lit when "+S.focus.replace(/_/g," ")+" recovers it",
               LAY.padL,LAY.gridTop-16);

  for(let i=0;i<D.payments.length;i++){
    const p=D.payments[i];
    const cx=LAY.padL+(i%cols)*cell+cell/2;
    const cy=LAY.gridTop+Math.floor(i/cols)*11+6;
    const born=p.t<=t;
    if(!born){ ctx.beginPath(); ctx.arc(cx,cy,1.4,0,7);
      ctx.fillStyle="rgba(255,255,255,.06)"; ctx.fill(); continue; }
    const at=lit.get(i);
    if(at!==undefined){
      const age=t-at, ig=Math.min(1,age/4);          // ignition ramp
      const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,7.5);
      gr.addColorStop(0,"rgba(255,217,138,"+(.95-ig*.2)+")");
      gr.addColorStop(.42,"rgba(245,177,61,"+(.55-ig*.18)+")");
      gr.addColorStop(1,"rgba(245,177,61,0)");
      ctx.beginPath(); ctx.arc(cx,cy,7.5,0,7); ctx.fillStyle=gr; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle=CSS("--flame-hot"); ctx.fill();
    } else if(recent.has(i)){
      const age=t-recent.get(i), fade=1-age/6;
      ctx.beginPath(); ctx.arc(cx,cy,r+1.4,0,7);
      ctx.strokeStyle="rgba(224,102,58,"+(fade*.75)+")"; ctx.lineWidth=1.3; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,r-.7,0,7); ctx.fillStyle=CSS("--dim"); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(cx,cy,r-.7,0,7); ctx.fillStyle=CSS("--dim"); ctx.fill();
    }
  }

  // --- the moving now-line -------------------------------------------------
  ctx.strokeStyle="rgba(245,177,61,.5)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x(t),LAY.padT-6); ctx.lineTo(x(t),LAY.padT+LAY.raceH+2); ctx.stroke();
}

function readout(){
  const f=D.arms[S.focus];
  let sum=0,n=0,att=0;
  for(const wi of f.wins){ if(wi[0]>S.t)break; sum+=wi[2]; n++; }
  for(const fi of f.fires){ if(fi[0]>S.t)break; att++; }
  document.getElementById("day").textContent="d"+(S.t/24).toFixed(1);
  document.getElementById("rec").textContent=money(sum);
  document.getElementById("recs").textContent=n+" of "+D.payments.length+" payments · "+att+" attempts spent";
  document.getElementById("rate").textContent=pct(sum/D.at_risk);
  document.getElementById("scrub").value=String(S.t);
}

let last=0;
function frame(ts){
  if(!last)last=ts;
  const dt=(ts-last)/1000; last=ts;
  if(S.playing){
    S.t+=dt*(D.span_h/20)*S.speed;      // a full 14 days in ~20 seconds at 1x
    if(S.t>=D.span_h){S.t=D.span_h;S.playing=false;syncBtn()}
  }
  draw(); readout();
  requestAnimationFrame(frame);
}
function syncBtn(){
  const b=document.getElementById("play");
  b.textContent=S.playing?"❚❚  Pause":(S.t>=D.span_h?"↻  Replay":"▶  Play");
}

/* ---------------- shell ---------------- */
function standings(){
  const max=Math.max(...D.order.map(n=>D.arms[n].total));
  return D.order.map(n=>{
    const a=D.arms[n];
    return '<tr><td class="nm"><i style="background:'+(S.on.has(n)?"var("+HUE[n]+")":"var(--dim)")+'"></i>'+esc(n)+'</td>'+
      '<td>'+money(a.total)+'</td><td>'+pct(a.rate)+'</td>'+
      '<td>'+a.count+'/'+D.payments.length+'</td><td>'+a.attempts+'</td><td>'+a.touched+'</td>'+
      '<td style="width:150px"><div class="bar" style="width:'+(a.total/max*100)+'%;background:'+
      (S.on.has(n)?"var("+HUE[n]+")":"var(--dim)")+'"></div></td></tr>';
  }).join("");
}

function shell(){
  document.getElementById("root").innerHTML=
  '<div class="mast"><h1>Muhurat</h1><span class="deva">मुहूर्त</span>'+
  '<span class="tag">seed '+D.seed+' · 300 failed payments · 110 real Razorpay error codes</span></div>'+
  '<p class="thesis">Every failed payment has a hidden window that opens when its real blocker clears — '+
  'an outage ending, a salary landing, a cooldown lapsing. Watch fourteen days pass and see which '+
  'policies are there at the right moment. <em>The question is never whether to retry. It is when.</em></p>'+

  '<div class="stage">'+
  '<div class="readout">'+
    '<div class="ro day"><div class="k">Elapsed</div><div class="v" id="day">d0.0</div>'+
      '<div class="s">of 14 days</div></div>'+
    '<div class="ro money"><div class="k">Recovered by focus arm</div><div class="v" id="rec">₹0</div>'+
      '<div class="s" id="recs">—</div></div>'+
    '<div class="ro"><div class="k">Rate</div><div class="v" id="rate">0.00%</div>'+
      '<div class="s">of '+money(D.at_risk)+' at risk</div></div>'+
  '</div>'+
  '<canvas id="cv" width="'+LAY.w+'" height="'+LAY.h+'" role="img" '+
    'aria-label="Replay of fourteen days: cumulative money recovered per policy, and a lamp per payment that lights when recovered"></canvas>'+
  '<div class="transport">'+
    '<button id="play" class="pri">❚❚  Pause</button>'+
    '<button id="restart">↻  Restart</button>'+
    '<input type="range" id="scrub" min="0" max="'+D.span_h+'" step="0.5" value="0" aria-label="Scrub through time">'+
    '<div class="spd">'+[0.5,1,2,4].map(s=>'<button data-s="'+s+'" aria-pressed="'+(s===1)+'">'+s+'×</button>').join("")+'</div>'+
  '</div>'+
  '<div class="chips" id="chips">'+D.order.map(n=>
    '<button class="chip'+(n===S.focus?" focus":"")+'" data-arm="'+esc(n)+'" aria-pressed="'+S.on.has(n)+'" '+
    'style="color:'+(S.on.has(n)?"var("+HUE[n]+")":"")+'">'+
    '<i class="dot"></i>'+esc(n)+'</button>').join("")+'</div>'+
  '<p class="hint">Click an arm to show or hide its line · click again to focus it and light its lamps</p>'+
  '</div>'+

  '<div class="panel"><h2>Final standings</h2><div class="scroll"><table>'+
  '<thead><tr><th>Arm</th><th>Recovered</th><th>Rate</th><th>Payments</th>'+
  '<th>Gateway attempts</th><th>Customers touched</th><th></th></tr></thead>'+
  '<tbody>'+standings()+'</tbody></table></div></div>'+

  '<footer>Every attempt you just watched was scheduled by a policy that could not see the window it '+
  'was aiming at — thirteen assertions in the test suite prove it. The executor is simulated, so no '+
  'live Razorpay call is made. Method and limitations in full in the repository README.</footer>';

  C=document.getElementById("cv");
  const dpr=Math.min(2,window.devicePixelRatio||1);
  C.width=LAY.w*dpr; C.height=LAY.h*dpr;
  C.style.aspectRatio=LAY.w+" / "+LAY.h;
  ctx=C.getContext("2d"); ctx.scale(dpr,dpr);
  wire();
}

function wire(){
  document.getElementById("play").onclick=()=>{
    if(S.t>=D.span_h)S.t=0;
    S.playing=!S.playing; syncBtn();
  };
  document.getElementById("restart").onclick=()=>{S.t=0;S.playing=true;syncBtn()};
  document.getElementById("scrub").oninput=e=>{S.t=+e.target.value;S.playing=false;syncBtn()};
  document.querySelectorAll(".spd button").forEach(b=>b.onclick=()=>{
    S.speed=+b.dataset.s;
    document.querySelectorAll(".spd button").forEach(o=>o.setAttribute("aria-pressed",String(o===b)));
  });
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{
    const n=b.dataset.arm;
    if(!S.on.has(n)){S.on.add(n);S.focus=n}
    else if(S.focus!==n){S.focus=n}
    else{ if(S.on.size>1){S.on.delete(n); S.focus=[...S.on][0];} }
    refreshChips();
  });
}
function refreshChips(){
  document.querySelectorAll("#chips .chip").forEach(b=>{
    const n=b.dataset.arm, on=S.on.has(n);
    b.setAttribute("aria-pressed",String(on));
    b.style.color=on?"var("+HUE[n]+")":"";
    b.classList.toggle("focus",n===S.focus);
  });
  document.querySelector("tbody").innerHTML=standings();
}

function boot(d){
  D=d;
  D.order.forEach((n,i)=>HUE[n]=SLOTS[i%SLOTS.length]);
  if(!D.arms[S.focus])S.focus=D.order[0];
  S.on=new Set(DEFAULT_ON.filter(n=>D.arms[n]));
  if(!S.on.size)S.on=new Set([D.order[0]]);
  shell();
  // Show the finished state first, then rewind and play, so a still frame or a
  // thumbnail is never an empty chart.
  S.t=D.span_h; draw(); readout();
  setTimeout(()=>{S.t=0;S.playing=true;syncBtn();},900);
  requestAnimationFrame(frame);
}

fetch("/api/replay").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(boot)
 .catch(e=>{document.getElementById("root").innerHTML=
  '<div class="err"><p>Could not load the replay ('+esc(e.message)+').</p>'+
  '<p class="mono" style="font-size:12px">python -m scripts.run_baseline &amp;&amp; python -m scripts.evaluate &amp;&amp; python -m scripts.export_replay</p></div>'});
</script>
</body>
</html>
