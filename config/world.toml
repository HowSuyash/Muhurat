# ------------------------------------------------- REASONS WITH NO RULE ROW ---
# These are absent from config/rules.toml, so the rules classifier cannot place
# them and falls back. Their true semantics are deliberately MIXED -- some
# recover quickly, some never -- so the fallback bucket is not uniformly
# anything. A classifier that guesses one behaviour for the whole bucket is
# punished, which is precisely the gap a Day-2 LLM classifier has to close.

[reason.mismatch_in_transaction_details]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "Details do not reconcile. Terminal on this rail."

[reason.deemed_transaction]
retry = "delay"
delay_min_hours = 2.0
delay_max_hours = 12.0
rail = "never"
contact = "never"
note = "Reconciliation lag. Often settles itself -- and looks terminal."

[reason.collect_on_mcc_blocked]
retry = "never"
rail = "never"
contact = "immediate"
note = "MCC restriction on collect. Structural."

[reason.transaction_daily_limit_exceeded]
retry = "delay"
delay_min_hours = 12.0
delay_max_hours = 30.0
rail = "immediate"
contact = "immediate"
note = "A daily limit resets at midnight. Reliably recoverable, just not soon."

[reason.debit_instrument_blocked]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "Card blocked by the customer or their bank."

[reason.user_not_eligible]
retry = "never"
rail = "never"
contact = "immediate"
note = "Eligibility is a business rule, not a transient fault."

