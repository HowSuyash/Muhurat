# ============================================================================
# The world model -- when a failed payment can actually be recovered.
#
# THE INTEGRITY CLAIM
# -------------------
# No number in this file is keyed by failure class. There are exactly five
# tunable constants, all global, all channel-level. Every difference between
# failure classes comes from WHEN THE WINDOW OPENS, which is derived from the
# failure's own semantics -- not from a coefficient chosen to make some arm win.
#
# This replaces config/outcome_model.toml, where P(success) was keyed on
# (failure_class, action). That design made retry TIMING invisible to the eval,
# which meant the one place real intelligence lives could not be measured. It is
# kept as a legacy executor so the two can be compared and the switch defended.
#
# scripts/selfcheck.py asserts this file contains no failure-class name.
# ============================================================================

schema_version = 1

# ---------------------------------------------------------------------------
# The complete set of tunable numbers. Six. All global.
# ---------------------------------------------------------------------------
[constants]

# The blocker is gone and the attempt lands inside the window: the payment
# clears. Not 1.0, because payments fail for uncorrelated reasons too.
p_in_retry = 0.90

# An alternate rail exists, is enabled for this customer, and they complete on
# it. Lower than a plain retry: switching rails asks something of the customer.
p_in_rail = 0.65

# We contacted the customer and they actually acted. This is a response rate,
# and response rates are poor. It is the reason contacting everyone is not a
# strategy, and why the eval reports recovered-per-customer-touched.
p_in_contact = 0.35

# Attempts outside the window are not impossible, just very unlikely. This
# softens the knife edge so a policy that misses by a minute is not treated
# identically to one that never had a chance.
p_out = 0.02

# After this many days the customer is gone: the order is abandoned, the cart
# is stale, the subscription lapsed. Every window closes at t0 + this.
attrition_horizon_days = 14

# Customers leak away continuously, not at a cliff. Every channel's success
# probability is multiplied by exp(-attrition_lambda * days_since_failure).
#
# Without this, a hard horizon alone is degenerate: one attempt at t0 + 13.9d
# lands inside EVERY window that exists -- gateway, outage, payday alike -- and
# a policy that always waits 13.9 days beats every arm with zero inference.
# That would replace "the config decides the answer" with "the horizon decides
# the answer".
#
# With it, lateness is paid for. Hitting a window early beats hitting it late,
# so estimating WHEN precisely becomes the skill under test. At 0.10/day a
# same-hour recovery keeps ~100% of its value, one day costs ~10%, and the
# 13.9-day degenerate strategy keeps only ~25%.
#
# scripts/run_baseline.py ships a MaxWaitPolicy (one attempt at t0 + 13.9d) as
# a permanent degeneracy probe. It must lose. If it ever wins, this model is
# broken and the eval says so immediately.
attrition_lambda = 0.10

# ---------------------------------------------------------------------------
# Per-reason recovery semantics.
#
# For each Razorpay error reason, which channels can EVER recover the payment,
# and when each opens. Delays are drawn uniformly from [min, max] hours.
#
#   retry   = same instrument, same rail, later
#   rail    = move the payment to a different rail (UPI)
#   contact = ask the customer to do something
#
# opens_at kinds:
#   "immediate"   opens at t0
#   "delay"       opens at t0 + uniform(delay_min_hours, delay_max_hours)
#   "payday"      opens at the customer's next payday (hidden, per-customer)
#   "outage_end"  opens when this payment's bank outage window closes
#   "never"       the channel never opens
# ---------------------------------------------------------------------------

# ------------------------------------------------------ INSUFFICIENT FUNDS ---
# Money arrives on a salary cycle. No amount of retrying creates it, and the
# wait is days, not hours -- which is exactly what a backoff policy cannot reach.

[reason.insufficient_funds]
retry = "payday"
rail = "never"          # a different rail into the same empty account
contact = "immediate"   # a genuinely different funding source can work
note = "Balance arrives on the salary cycle. Timing is the whole intervention."

[reason.credit_limit_exceeded]
retry = "payday"        # statement reset behaves like a payday
rail = "never"
contact = "immediate"
note = "Cardless-EMI limit resets on the statement cycle."

[reason.funds_blocked_by_mandate]
retry = "delay"
delay_min_hours = 18.0
delay_max_hours = 36.0
rail = "never"
contact = "immediate"
note = "A one-time-mandate hold releases on its own within a day or so."

# ----------------------------------------------------------- BANK DOWNTIME ---
# Opens when the outage ends. The outage is real, clustered, and shared across
# every payment hitting that bank -- which is what makes it inferable from
# correlated failures without ever reading the truth.

[reason.bank_not_available]
retry = "outage_end"
rail = "immediate_if_not_upi"
contact = "never"       # a customer cannot fix their bank being down
note = "Issuer outage. Opens the moment the outage ends, not before."

[reason.bank_technical_error]
retry = "outage_end"
rail = "immediate_if_not_upi"
contact = "never"
note = "Core Banking System fault. Same shape as any other outage."

[reason.issuer_technical_error]
retry = "outage_end"
rail = "immediate_if_not_upi"
contact = "never"
note = "Issuer-side technical fault."

[reason.bank_cutoff_in_progress]
retry = "outage_end"
rail = "immediate_if_not_upi"
contact = "never"
note = "Scheduled CBS cutoff -- the most predictable outage there is."

[reason.psp_not_available]
retry = "outage_end"
rail = "never"          # already UPI
contact = "never"
note = "PSP downtime."

[reason.upi_app_technical_error]
retry = "outage_end"
rail = "never"
contact = "never"
note = "Fault in the customer's PSP app."

[reason.payment_declined_due_to_high_traffic]
retry = "outage_end"
rail = "immediate_if_not_upi"
contact = "never"
note = "TPS surge. Behaves as an outage and ends like one."

# --------------------------------------------------------- GATEWAY TIMEOUT ---
# Genuinely transient. Opens in under ten minutes and stays open. This is the
# only class where retrying almost immediately is the correct move.

[reason.gateway_technical_error]
retry = "delay"
delay_min_hours = 0.008   # 30 seconds
delay_max_hours = 0.133   # 8 minutes
rail = "immediate"
contact = "immediate"
note = "Transient infra fault; resolves in seconds to minutes."

[reason.request_timed_out]
retry = "delay"
delay_min_hours = 0.008
delay_max_hours = 0.133
rail = "immediate"
contact = "immediate"
note = "No terminal state was reached; nothing was actually declined."

[reason.payment_timed_out]
retry = "delay"
delay_min_hours = 0.008
delay_max_hours = 0.133
rail = "immediate"
contact = "immediate"
note = "Gateway returned no response."

[reason.invalid_response_from_gateway]
retry = "delay"
delay_min_hours = 0.008
delay_max_hours = 0.133
rail = "immediate"
contact = "immediate"
note = "Malformed response, not a decline."

[reason.server_error]
retry = "delay"
delay_min_hours = 0.008
delay_max_hours = 0.133
rail = "immediate"
contact = "immediate"
note = "Razorpay-side fault."

[reason.payment_collect_request_expired]
retry = "delay"
delay_min_hours = 0.008
delay_max_hours = 0.133
rail = "immediate"
contact = "immediate"
note = "The collect window lapsed; re-sending costs nothing."

# ------------------------------------------------------------- OTP TIMEOUT ---
# A silent retry cannot produce an OTP. These need the customer, except
# otp_attempts_exceeded, which needs the issuer's cooldown to lapse first.

[reason.otp_expired]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "Needs a fresh OTP the customer enters. No retry can manufacture one."

[reason.incorrect_otp]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "Customer mistyped. Re-engage, do not retry."

[reason.authentication_failed]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "3DS/OTP abandonment. A drop-off problem."

[reason.payment_session_expired]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "The checkout session died; the instrument is fine."

[reason.otp_attempts_exceeded]
retry = "delay"
delay_min_hours = 8.0
delay_max_hours = 24.0
rail = "immediate"
contact = "never"       # the card is blocked; contacting cannot help yet
note = "Issuer temp-blocks the card. Only the cooldown lapsing helps."

# ------------------------------------------------------------ EXPIRED CARD ---

[reason.card_expired]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "Still expired tomorrow, and the day after. Retry is pure waste."

[reason.incorrect_card_expiry_date]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "Wrong data on file; only the customer can correct it."

# ------------------------------------------------------------ RISK DECLINE ---

[reason.payment_risk_check_failed]
retry = "never"
rail = "never"          # risk follows the customer across rails
contact = "never"       # escalation only; nothing automated recovers this
note = "Genuine risk signal. Nothing in the pipeline should recover it."

[reason.card_declined]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "Opaque issuer refusal. It will refuse again."

[reason.payment_declined]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "Opaque issuer or gateway decline."

[reason.international_transaction_not_allowed]
retry = "never"
rail = "immediate"
contact = "immediate"
note = "This card can never clear this transaction. A domestic rail can."

# ------------------------------------------------------------- INVALID VPA ---
# The pair that makes the point: two near-identical strings, opposite truths.

[reason.invalid_vpa]
retry = "never"
rail = "never"          # already UPI
contact = "immediate"
note = "The VPA is wrong. It is equally wrong on attempt three."

[reason.psp_not_registered]
retry = "never"
rail = "never"
contact = "immediate"
note = "No PSP on the device; needs a different handle."

[reason.vpa_resolution_failed]
retry = "delay"
delay_min_hours = 0.17    # 10 minutes
delay_max_hours = 1.5     # 90 minutes
rail = "never"
contact = "immediate"
note = "NPCI resolution fault, NOT a bad VPA. Recovers on its own."

# ---------------------------------------------------------- MANDATE FAILURE ---

[reason.mandate_creation_failed]
retry = "never"
rail = "never"
contact = "immediate"
note = "Terminal per Razorpay's docs. Re-registration is the only path."

[reason.mandate_creation_declined]
retry = "never"
rail = "never"
contact = "immediate"
note = "Declined by an entity in the chain. Terminal."

[reason.mandate_creation_expired]
