[project]
name = "ai-revenue-recovery"
version = "0.1.0"
description = "Razorpay AI Buildathon Track 03 -- diagnose failed payments, choose a bounded recovery action, measure the money recovered."
readme = "README.md"
# 3.11 is the floor (tomllib, StrEnum, and PEP 604 unions in dataclasses).
# Developed and measured on 3.13.14.
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
