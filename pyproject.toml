[project]
name = "muhurat"
version = "0.1.0"
description = "Muhurat -- a benchmark for failed-payment recovery, where the decision is when to act, not whether. Razorpay AI Buildathon, Track 03."
readme = "README.md"
# 3.11 is the floor (tomllib, StrEnum, and PEP 604 unions in dataclasses).
# Developed and measured on 3.13.14.
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
